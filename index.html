<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWS ECR + EC2 CI/CD Live</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem 3rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      text-align: center;
      border: 1px solid #334155;
    }
    .badge {
      display: inline-block;
      background: #10b981;
      color: #064e3b;
      font-weight: 700;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    h1 { margin: 0 0 0.75rem 0; font-size: 1.75rem; }
    p { color: #94a3b8; margin: 0.25rem 0; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">LIVE ON AWS EC2</span>
    <h1>Deployed via GitHub Actions + Amazon ECR</h1>
    <p>Zero-Code Nginx Alpine Container</p>
    <p><strong>Version:</strong> 1.0</p>
  </div>
</body>
</html>
